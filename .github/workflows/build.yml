name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.19
      - run: pio run
      - run: python tools/test_native.py
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/flight-source-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/flight-source-probe/package-lock.json
      - run: npm ci
      - run: npm test
